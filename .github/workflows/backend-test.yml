name: Backend - Container Test

on:
  push:
    branches: ["main"]
    paths:
      - "engineering/backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "engineering/backend/**"
      - ".github/workflows/backend-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: engineering/backend/go.sum

      # - name: Run go vet
      #   run: go vet ./...

      # - name: Run gofmt check
      #   run: |
      #     unformatted=$(gofmt -l .)
      #     if [ -n "$unformatted" ]; then
      #       echo "The following files are not gofmt-formatted:"
      #       echo "$unformatted"
      #       exit 1
      #     fi

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./engineering/backend
          file: ./engineering/backend/Dockerfile.backend
          push: false
          load: true
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run docker container
        run: |
          docker run -d --name backend \
            -e DB_USER=test_user \
            -e DB_PASSWORD=test_password \
            -e DB_NAME=test_db \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e CRAWLER_API_URL=http://crawler:8000 \
            -e THUNDER_BASE_URL=https://thunder:8090 \
            -e THUNDER_ISSUER=https://thunder:8090 \
            -e THUNDER_AUDIENCE=https://tvec.gov.lk \
            -e THUNDER_INSECURE_TLS=true \
            -e MCP_PUBLIC_BASE_URL=http://localhost:9090 \
            -e MCP_RESOURCE_ID=http://localhost:9090/mcp \
            backend:latest

          # wait for 3 seconds
          sleep 3

          if [ "$(docker inspect -f '{{.State.Running}}' backend)" == "true" ]; then
            echo "Success: Container is running..."
          else
            echo "Error: Container crashed, showing logs below:"
            docker logs backend
            exit 1
          fi

      - name: Verify container health
        run: |
          sleep 5
          docker ps | grep backend | grep -q "Up" || (echo "Container is not healthy" && exit 1)
          echo "Container is running successfully..."

      - name: Stop docker container
        run: |
          docker stop backend

          if [ "$(docker inspect -f '{{.State.Status}}' backend)" == "exited" ]; then
            echo "Success: Container stopped!"
          else
            echo "Error: Container stop failed, showing logs below:"
            docker logs backend
            exit 1
          fi

      - name: Remove docker container
        run: |
          docker rm -f backend || true

          if [ -z "$(docker ps -aq -f name=^backend$)" ]; then
            echo "Container removed successfully"
          else
            echo "Container removal failed"
            exit 1
          fi

      - name: Remove docker image
        run: |
          docker rmi -f backend:latest || true

          if [ -z "$(docker images -q --filter "reference=backend")" ]; then
            echo "Image removed successfully"
          else
            echo "Image removal failed"
            docker images
            exit 1
          fi
