name: Build Backend

on:
  push:
    branches: ["main"]
    paths:
      - 'engineering/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'engineering/backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: engineering/backend/go.sum

      - name: Run Backend Tests
        run: |
          cd engineering/backend
          go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./engineering/backend
          file: ./engineering/backend/Dockerfile.backend
          push: false
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max