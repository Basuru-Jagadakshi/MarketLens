apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.fullname" . }}-secret
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  THUNDERID_SECRET: {{ .Values.secrets.thunderIdSecret | quote }}
  THUNDERID_CLIENT_SECRET: {{ .Values.secrets.thunderIdClientSecret | quote }}