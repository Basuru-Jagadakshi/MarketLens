openapi: 3.0.3
info:
  title: MarketLens Go Backend API
  description: |
    Core REST API for the MarketLens Sri Lankan Labour Market Analysis Platform.
    Handles job post management, crawler lifecycle, reference data, and all analytics endpoints.
  version: 1.0.0
  contact:
    name: MarketLens Engineering

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: http://go_backend:8080/api/v1
    description: Docker internal network

tags:
  - name: Crawler
    description: Crawler run lifecycle and monitoring
  - name: Jobs
    description: Job post management and retrieval
  - name: Reference Data
    description: Lookup tables — industries, occupations, provinces, etc.
  - name: Stats
    description: National labour market statistics
  - name: Industry Analytics
    description: Industry-level skill and employer analytics
  - name: Occupation Analytics
    description: Occupation-level trend and role analytics
  - name: Sources
    description: Crawl source reporting


components:
  schemas:

    Employer:
      type: object
      properties:
        id:   { type: integer, example: 5 }
        name: { type: string,  example: "WSO2" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobType:
      type: object
      properties:
        id:   { type: integer, example: 1 }
        type: { type: string,  example: "Full Time" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Skill:
      type: object
      properties:
        id:    { type: integer, example: 12 }
        skill: { type: string,  example: "Go (Golang)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GeoData:
      type: object
      properties:
        id:        { type: integer, example: 1 }
        province:  { type: string,  example: "Western" }
        latitude:  { type: number,  format: double, example: 6.9271 }
        longitude: { type: number,  format: double, example: 79.8612 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Industry:
      type: object
      properties:
        id:   { type: integer, example: 14 }
        name: { type: string,  example: "Information and Communication" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Occupation:
      type: object
      properties:
        id:   { type: integer, example: 8 }
        name: { type: string,  example: "Professionals" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EducationLevel:
      type: object
      properties:
        id:    { type: integer, example: 1 }
        level: { type: string,  example: "Degree & Above" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Experience:
      type: object
      properties:
        id:   { type: integer, example: 1 }
        name: { type: string,  example: "Experience Required" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Source:
      type: object
      properties:
        id:     { type: integer, example: 3 }
        source: { type: string,  example: "Ikman" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiVersion:
      type: object
      properties:
        id:      { type: integer, example: 1 }
        version: { type: string,  example: "deepseek-v1" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }


    CrawlerRun:
      type: object
      properties:
        id:          { type: integer, example: 3 }
        started_at:  { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]
          example: COMPLETED
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }


    JobMetaData:
      type: object
      properties:
        job_post_id:        { type: integer, example: 6 }
        ai_version_id:      { type: integer, nullable: true, example: 1 }
        ai_version:         { $ref: "#/components/schemas/AiVersion" }
        education_level_id: { type: integer, nullable: true, example: 1 }
        education_level:    { $ref: "#/components/schemas/EducationLevel" }
        crawler_run_id:     { type: integer, nullable: true, example: 2 }
        geo_data_id:        { type: integer, nullable: true, example: 1 }
        geo_data:           { $ref: "#/components/schemas/GeoData" }
        industry_id:        { type: integer, nullable: true, example: 14 }
        industry:           { $ref: "#/components/schemas/Industry" }
        occupation_id:      { type: integer, nullable: true, example: 8 }
        occupation:         { $ref: "#/components/schemas/Occupation" }
        source_id:          { type: integer, nullable: true, example: 3 }
        source:             { $ref: "#/components/schemas/Source" }
        experience_id:      { type: integer, nullable: true, example: 1 }
        experience:         { $ref: "#/components/schemas/Experience" }
        posted_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-12T11:45:00Z"
        end_date:
          type: string
          format: date-time
          nullable: true
        minhash_signature:
          type: array
          items: { type: integer }
          example: [5541, 1029, 8832, 4410, 7765, 2391, 9088, 1142]
        confidence_score:
          type: number
          format: double
          example: 0.97
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobPost:
      type: object
      properties:
        id:
          type: integer
          example: 6
        employer_id:
          type: integer
          nullable: true
          example: 5
        employer:
          $ref: "#/components/schemas/Employer"
        job_type_id:
          type: integer
          nullable: true
          example: 1
        job_type:
          $ref: "#/components/schemas/JobType"
        job_role:
          type: string
          example: "Junior Backend Developer"
        is_remote:
          type: boolean
          example: false
        job_description:
          type: string
          example: "Design and implement robust microservices patterns..."
        location:
          type: string
          example: "Colombo 03, Sri Lanka"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        meta_data:
          $ref: "#/components/schemas/JobMetaData"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"


    LshIndex:
      type: object
      required: [band_no, bucket_key]
      properties:
        band_no:    { type: integer, example: 0 }
        bucket_key: { type: string,  example: "b0_wso2_tech_hash501" }

    JobPostInput:
      type: object
      required: [employer, job_role, job_type, job_description, location, is_remote, meta_data, skills]
      properties:
        employer:
          type: object
          required: [name]
          properties:
            name: { type: string, example: "WSO2" }
        job_role:
          type: string
          example: "Junior Backend Developer"
        job_type:
          type: object
          required: [type]
          properties:
            type: { type: string, example: "Full Time" }
        job_description:
          type: string
          example: "Design and implement robust microservices patterns..."
        location:
          type: string
          example: "Colombo 03, Sri Lanka"
        is_remote:
          type: boolean
          example: false
        meta_data:
          type: object
          required: [geo_data, industry, occupation, education_level, experience, source, ai_version, posted_at, confidence_score, crawler_run_id, minhash_signature]
          properties:
            geo_data:
              type: object
              required: [province]
              properties:
                province: { type: string, example: "Western" }
            industry:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Information and Communication" }
            occupation:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Professionals" }
            education_level:
              type: object
              required: [level]
              properties:
                level: { type: string, example: "Degree & Above" }
            experience:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Experience Required" }
            source:
              type: object
              required: [source]
              properties:
                source: { type: string, example: "Ikman" }
            ai_version:
              type: object
              required: [version]
              properties:
                version: { type: string, example: "deepseek-v1" }
            posted_at:
              type: string
              format: date-time
              example: "2026-06-12T11:45:00Z"
            confidence_score:
              type: number
              format: double
              example: 0.97
            crawler_run_id:
              type: integer
              example: 2
            minhash_signature:
              type: array
              items: { type: integer }
              example: [5541, 1029, 8832, 4410, 7765, 2391, 9088, 1142]
        skills:
          type: array
          items:
            type: object
            required: [skill]
            properties:
              skill: { type: string, example: "Go (Golang)" }

    BatchSavePayload:
      type: object
      required: [new_jobs, lsh_indexes]
      properties:
        new_jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobPostInput"
        lsh_indexes:
          type: array
          items:
            $ref: "#/components/schemas/LshIndex"

    BatchUpdatePayload:
      type: object
      required: [duplicates]
      properties:
        duplicates:
          type: array
          items:
            type: object
            required: [job_post_id, crawler_run_id]
            properties:
              job_post_id:    { type: integer, example: 42 }
              crawler_run_id: { type: integer, example: 3 }

    ReconciliationPayload:
      type: object
      required: [crawler_run_id]
      properties:
        crawler_run_id: { type: integer, example: 3 }


    ActiveJobStats:
      type: object
      properties:
        active_job_count:  { type: integer, example: 312 }
        last_month_count:  { type: integer, example: 280 }
        change_percent:    { type: number,  example: 11.43 }
        trend:
          type: string
          enum: [up, down, stable]
          example: up

    SkillDemand:
      type: object
      properties:
        id:             { type: integer, example: 12 }
        skill:          { type: string,  example: "Go (Golang)" }
        open_job_count: { type: integer, example: 89 }

    EmployerDemand:
      type: object
      properties:
        id:             { type: integer, example: 5 }
        name:           { type: string,  example: "WSO2" }
        open_job_count: { type: integer, example: 45 }

    OccupationJobCount:
      type: object
      properties:
        id:             { type: integer, example: 8 }
        name:           { type: string,  example: "Professionals" }
        open_job_count: { type: integer, example: 154 }

    IndustryJobCount:
      type: object
      properties:
        id:             { type: integer, example: 14 }
        name:           { type: string,  example: "Information and Communication" }
        open_job_count: { type: integer, example: 312 }

    ExperienceJobCount:
      type: object
      properties:
        id:             { type: integer, example: 1 }
        name:           { type: string,  example: "Experience Required" }
        open_job_count: { type: integer, example: 280 }

    EducationLevelJobCount:
      type: object
      properties:
        id:             { type: integer, example: 1 }
        level:          { type: string,  example: "Degree & Above" }
        open_job_count: { type: integer, example: 210 }

    JobTypeJobCount:
      type: object
      properties:
        id:             { type: integer, example: 1 }
        type:           { type: string,  example: "Full Time" }
        open_job_count: { type: integer, example: 290 }

    RemoteOnSiteCount:
      type: object
      properties:
        remote_count:  { type: integer, example: 42 }
        on_site_count: { type: integer, example: 270 }

    SourceJobCount:
      type: object
      properties:
        id:             { type: integer, example: 3 }
        source:         { type: string,  example: "Ikman" }
        open_job_count: { type: integer, example: 180 }

    YearlyTrend:
      type: object
      properties:
        year:           { type: integer, example: 2026 }
        open_job_count: { type: integer, example: 312 }

    TopJobRole:
      type: object
      properties:
        job_role:       { type: string,  example: "Senior Software Engineer" }
        open_job_count: { type: integer, example: 24 }

    ProvinceJobCount:
      type: object
      properties:
        id:             { type: integer, example: 1 }
        province:       { type: string,  example: "Western" }
        lat:            { type: number,  example: 6.9271 }
        lng:            { type: number,  example: 79.8612 }
        open_job_count: { type: integer, example: 250 }

    CrawlTimeGap:
      type: object
      properties:
        last_crawled_at: { type: string, format: date-time, nullable: true }
        gap_seconds:     { type: number, example: 3720 }
        gap_human:       { type: string, example: "1 hour(s) 2 minute(s) ago" }


    ErrorResponse:
      type: object
      properties:
        error:   { type: string, example: "Failed to retrieve data" }
        details: { type: string, example: "pq: relation does not exist" }

    MessageResponse:
      type: object
      properties:
        message: { type: string, example: "Operation completed successfully" }

  parameters:
    IndustryIdQuery:
      name: industry_id
      in: query
      required: true
      schema: { type: integer }
      description: Industry ID — use GET /industries to find valid IDs

    OccupationIdQuery:
      name: occupation_id
      in: query
      required: true
      schema: { type: integer }
      description: Occupation ID — use GET /stats/by-occupation to find valid IDs

    YearQuery:
      name: year
      in: query
      required: true
      schema: { type: integer }
      description: Calendar year e.g. 2026

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }


paths:


  /crawler/runs:
    post:
      tags: [Crawler]
      summary: Start a new crawler run
      description: |
        Initializes a new crawler session. Any existing RUNNING sessions are
        automatically transitioned to FAILED before the new one is created.
      responses:
        "201":
          description: Crawler run created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerRun" }
              example:
                id: 3
                started_at: "2026-07-10T08:00:00Z"
                finished_at: null
                status: RUNNING
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [Crawler]
      summary: Get all crawler runs
      description: Returns full crawler run history ordered by most recent first.
      responses:
        "200":
          description: List of crawler runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 5 }
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/CrawlerRun" }
        "500": { $ref: "#/components/responses/InternalError" }

  /crawler/runs/{id}/complete:
    post:
      tags: [Crawler]
      summary: Complete or fail a crawler run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Crawler run ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [COMPLETED, FAILED]
                  example: COMPLETED
      responses:
        "200":
          description: Run finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Crawler run 3 finalized with state: COMPLETED" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /crawler/last-job-count:
    get:
      tags: [Crawler]
      summary: Get last crawl job count
      description: Returns total number of job records ingested during the most recent COMPLETED crawler run.
      responses:
        "200":
          description: Last crawl job count
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_crawl_job_count: { type: integer, example: 142 }
        "500": { $ref: "#/components/responses/InternalError" }

  /crawler/time-gap:
    get:
      tags: [Crawler]
      summary: Get time since last crawl
      description: Returns how long ago the most recent COMPLETED crawler run finished.
      responses:
        "200":
          description: Time gap since last crawl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlTimeGap" }
        "500": { $ref: "#/components/responses/InternalError" }


  /jobs:
    get:
      tags: [Jobs]
      summary: Get active job listings
      description: |
        Returns all active job postings (end_date IS NULL).
        All query parameters are optional and can be combined freely.
      parameters:
        - name: industry_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by industry ID
        - name: geo_data_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by province ID
        - name: job_type_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by job type ID
        - name: experience_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by experience level ID
      responses:
        "200":
          description: Active job listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 42 }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/JobPost" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/batch-save:
    post:
      tags: [Jobs]
      summary: Batch insert new unique job listings
      description: |
        Transactional batch insert for new jobs validated through the deduplication pipeline.
        Individual job failures are isolated — failed jobs are skipped and logged without
        aborting the entire batch. LSH index records for failed jobs are automatically excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchSavePayload" }
      responses:
        "200":
          description: Batch inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:          { type: string, example: "Successfully persisted unique job block chunk" }
                  inserted_records: { type: integer, example: 12 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/batch-update:
    post:
      tags: [Jobs]
      summary: Batch update duplicate job crawler references
      description: |
        Refreshes crawler_run_id on existing active jobs identified as duplicates.
        This keep-alive mechanism prevents valid active listings from being retired
        during the next reconciliation sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchUpdatePayload" }
      responses:
        "200":
          description: Duplicates refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:           { type: string, example: "Successfully refreshed duplicate job keep-alive markers" }
                  refreshed_records: { type: integer, example: 8 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/reconcile:
    post:
      tags: [Jobs]
      summary: Reconcile stale vacancies
      description: |
        Marks all active job postings not encountered in the current crawler run as expired
        by setting their end_date. Simultaneously purges their LSH index entries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationPayload" }
      responses:
        "200":
          description: Reconciliation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:               { type: string, example: "System-wide stale vacancy cleanup sweep finalized" }
                  reconciled_stale_jobs: { type: integer, example: 23 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/radar/lookup:
    post:
      tags: [Jobs]
      summary: LSH bucket key lookup for deduplication
      description: |
        Queries the LSH index for matching bucket keys and returns full job records
        for Jaccard similarity comparison by the crawler pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket_keys]
              properties:
                bucket_keys:
                  type: array
                  items: { type: string }
                  example: ["b0_wso2_tech_hash501", "b1_wso2_tech_hash502"]
      responses:
        "200":
          description: Matching job records for similarity comparison
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobPost" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/{id}:
    delete:
      tags: [Jobs]
      summary: Delete a job post
      description: Permanently deletes a job post and all associated skill junction records.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Job post ID
      responses:
        "200":
          description: Job deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Job post with ID 6 has been successfully deleted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }


  /industries:
    get:
      tags: [Reference Data]
      summary: Get all industries
      description: Returns all 21 SLSIC industry classifications.
      responses:
        "200":
          description: Industry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer, example: 21 }
                  industries:
                    type: array
                    items: { $ref: "#/components/schemas/Industry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /occupations:
    get:
      tags: [Reference Data]
      summary: Get all occupations
      description: Returns all 10 SLSO occupation bands.
      responses:
        "200":
          description: Occupation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:       { type: integer, example: 10 }
                  occupations:
                    type: array
                    items: { $ref: "#/components/schemas/Occupation" }
        "500": { $ref: "#/components/responses/InternalError" }

  /provinces:
    get:
      tags: [Reference Data]
      summary: Get all provinces
      description: Returns all 9 Sri Lankan provinces with coordinate data.
      responses:
        "200":
          description: Province list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:     { type: integer, example: 9 }
                  provinces:
                    type: array
                    items: { $ref: "#/components/schemas/GeoData" }
        "500": { $ref: "#/components/responses/InternalError" }

  /experiences:
    get:
      tags: [Reference Data]
      summary: Get all experience levels
      responses:
        "200":
          description: Experience level list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:       { type: integer, example: 2 }
                  experiences:
                    type: array
                    items: { $ref: "#/components/schemas/Experience" }
        "500": { $ref: "#/components/responses/InternalError" }

  /job-types:
    get:
      tags: [Reference Data]
      summary: Get all job types
      responses:
        "200":
          description: Job type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:     { type: integer, example: 3 }
                  job_types:
                    type: array
