server:
  hostname: "0.0.0.0"
  public_url: "https://thunder:8090"
  port: 8090
  security:
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "database/runtime_transient.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "database/runtime_persistent.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
    preferred_key_id: "default-key"

passkey:
  allowed_origins:
    - "https://thunder:8090"

email:
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "noreplytvecdev@gmail.com"
    password: {{.SMTP_PASSWORD}}
    from_address: "noreplytvecdev@gmail.com"
    enable_start_tls: true
    enable_authentication: true
