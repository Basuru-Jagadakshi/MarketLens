openapi: 3.0.3
info:
  title: MarketLens BFF API
  description: |
    Backend-for-Frontend aggregation layer for the MarketLens platform.
    Each endpoint fans out to multiple Go backend calls in parallel via Promise.all
    and returns a single shaped response optimised for the frontend's data needs.
  version: 1.0.0
  contact:
    name: MarketLens Engineering

servers:
  - url: http://localhost:8081/api/v1
    description: Local development
  - url: http://nextjs_bff:8081/api/v1
    description: Docker internal network

tags:
  - name: Dashboard
    description: Aggregated dashboard overview and analytics panel data
  - name: Vacancies
    description: Vacancy explorer — listings and filter metadata
  - name: Industry
    description: Industry-level skill analytics
  - name: Crawler
    description: Crawler operations monitoring overview

components:
  schemas:


    IdName:
      type: object
      properties:
        id:   { type: integer, example: 14 }
        name: { type: string,  example: "Information and Communication" }

    IdLevel:
      type: object
      properties:
        id:    { type: integer, example: 1 }
        level: { type: string,  example: "Degree & Above" }

    IdType:
      type: object
      properties:
        id:   { type: integer, example: 1 }
        type: { type: string,  example: "Full Time" }

    IdSource:
      type: object
      properties:
        id:     { type: integer, example: 3 }
        source: { type: string,  example: "Ikman" }

    JobCountStat:
      description: Reusable shape for any entity paired with its active job count
      type: object
      properties:
        id:             { type: integer }
        open_job_count: { type: integer }

    YearlyTrend:
      type: object
      properties:
        year:           { type: integer, example: 2026 }
        open_job_count: { type: integer, example: 312 }

    Province:
      type: object
      properties:
        id:             { type: integer, example: 1 }
        province:       { type: string,  example: "Western" }
        lat:            { type: number,  example: 6.9271 }
        lng:            { type: number,  example: 79.8612 }
        open_job_count: { type: integer, example: 250 }


    ActiveJobStats:
      type: object
      properties:
        active_job_count: { type: integer, example: 312 }
        last_month_count: { type: integer, example: 280 }
        change_percent:   { type: number,  example: 11.43 }
        trend:
          type: string
          enum: [up, down, stable]
          example: up

    OccupationStat:
      allOf:
        - $ref: "#/components/schemas/IdName"
        - type: object
          properties:
            open_job_count: { type: integer, example: 154 }

    IndustryStat:
      allOf:
        - $ref: "#/components/schemas/IdName"
        - type: object
          properties:
            open_job_count: { type: integer, example: 312 }

    ExperienceStat:
      allOf:
        - $ref: "#/components/schemas/IdName"
        - type: object
          properties:
            open_job_count: { type: integer, example: 280 }

    EducationStat:
      allOf:
        - $ref: "#/components/schemas/IdLevel"
        - type: object
          properties:
            open_job_count: { type: integer, example: 210 }

    JobTypeStat:
      allOf:
        - $ref: "#/components/schemas/IdType"
        - type: object
          properties:
            open_job_count: { type: integer, example: 290 }

    RemoteOnSiteStat:
      type: object
      properties:
        remote_count:  { type: integer, example: 42 }
        on_site_count: { type: integer, example: 270 }

    DashboardOverview:
      type: object
      properties:
        active_jobs:
          $ref: "#/components/schemas/ActiveJobStats"
        by_occupation:
          type: object
          properties:
            count:       { type: integer, example: 10 }
            occupations:
              type: array
              items: { $ref: "#/components/schemas/OccupationStat" }
        by_industry:
          type: object
          properties:
            count:      { type: integer, example: 21 }
            industries:
              type: array
              items: { $ref: "#/components/schemas/IndustryStat" }
        by_experience:
          type: object
          properties:
            count:       { type: integer, example: 2 }
            experiences:
              type: array
              items: { $ref: "#/components/schemas/ExperienceStat" }
        by_education:
          type: object
          properties:
            count:            { type: integer, example: 5 }
            education_levels:
              type: array
              items: { $ref: "#/components/schemas/EducationStat" }
        remote_vs_onsite:
          $ref: "#/components/schemas/RemoteOnSiteStat"
        by_job_type:
          type: object
          properties:
            count:     { type: integer, example: 3 }
            job_types:
              type: array
              items: { $ref: "#/components/schemas/JobTypeStat" }


    OccupationYearlyTrendResponse:
      type: object
      properties:
        occupation_id: { type: integer, example: 8 }
        count:         { type: integer, example: 3 }
        yearly_trend:
          type: array
          items: { $ref: "#/components/schemas/YearlyTrend" }

    TopJobRole:
      type: object
      properties:
        job_role:       { type: string,  example: "Senior Software Engineer" }
        open_job_count: { type: integer, example: 24 }

    TopJobRolesResponse:
      type: object
      properties:
        occupation_id: { type: integer, example: 8 }
        top_job_roles:
          type: array
          items: { $ref: "#/components/schemas/TopJobRole" }

    OccupationAnalytics:
      type: object
      properties:
        occupation_id: { type: integer, example: 8 }
        yearly_trend:
          $ref: "#/components/schemas/OccupationYearlyTrendResponse"
        top_job_roles:
          $ref: "#/components/schemas/TopJobRolesResponse"


    IndustryYearlyTrendResponse:
      type: object
      properties:
        industry_id:  { type: integer, example: 14 }
        count:        { type: integer, example: 3 }
        yearly_trend:
          type: array
          items: { $ref: "#/components/schemas/YearlyTrend" }

    IndustryExperienceResponse:
      type: object
      properties:
        industry_id: { type: integer, example: 14 }
        year:        { type: integer, example: 2026 }
        count:       { type: integer, example: 2 }
        experiences:
          type: array
          items: { $ref: "#/components/schemas/ExperienceStat" }

    IndustryProvinceResponse:
      type: object
      properties:
        industry_id: { type: integer, example: 14 }
        year:        { type: integer, example: 2026 }
        count:       { type: integer, example: 9 }
        provinces:
          type: array
          items: { $ref: "#/components/schemas/Province" }

    IndustryEducationResponse:
      type: object
      properties:
        industry_id:      { type: integer, example: 14 }
        year:             { type: integer, example: 2026 }
        count:            { type: integer, example: 5 }
        education_levels:
          type: array
          items: { $ref: "#/components/schemas/EducationStat" }

    EmployerDemand:
      type: object
      properties:
        id:             { type: integer, example: 5 }
        name:           { type: string,  example: "WSO2" }
        open_job_count: { type: integer, example: 45 }

    IndustryTopEmployersResponse:
      type: object
      properties:
        industry_id: { type: integer, example: 14 }
        year:        { type: integer, example: 2026 }
        count:       { type: integer, example: 10 }
        employers:
          type: array
          items: { $ref: "#/components/schemas/EmployerDemand" }

    IndustryAnalytics:
      type: object
      properties:
        industry_id:  { type: integer, example: 14 }
        year:         { type: integer, example: 2026 }
        yearly_trend:
          $ref: "#/components/schemas/IndustryYearlyTrendResponse"
        by_experience:
          $ref: "#/components/schemas/IndustryExperienceResponse"
        by_province:
          $ref: "#/components/schemas/IndustryProvinceResponse"
        by_education:
          $ref: "#/components/schemas/IndustryEducationResponse"
        top_employers:
          $ref: "#/components/schemas/IndustryTopEmployersResponse"


    VacancyMetadata:
      type: object
      properties:
        industries:
          type: array
          items: { $ref: "#/components/schemas/IdName" }
        experiences:
          type: array
          items: { $ref: "#/components/schemas/IdName" }
        provinces:
          type: array
          items:
            type: object
            properties:
              id:       { type: integer, example: 1 }
              province: { type: string,  example: "Western" }
              lat:      { type: number,  example: 6.9271 }
              lng:      { type: number,  example: 79.8612 }
        job_types:
          type: array
          items: { $ref: "#/components/schemas/IdType" }

    VacancyGeoData:
      type: object
      properties:
        id:       { type: integer, example: 1 }
        province: { type: string,  example: "Western" }
        lat:      { type: number,  example: 6.9271 }
        lng:      { type: number,  example: 79.8612 }

    VacancyMetaData:
      type: object
      properties:
        geo_data:
          $ref: "#/components/schemas/VacancyGeoData"
        industry:
          $ref: "#/components/schemas/IdName"
        experience:
          $ref: "#/components/schemas/IdName"
        posted_at: { type: string, format: date-time, example: "2026-06-12T11:45:00Z" }
        end_date:  { type: string, format: date-time, nullable: true }

    VacancySkill:
      type: object
      properties:
        id:    { type: integer, example: 12 }
        skill: { type: string,  example: "Go (Golang)" }

    Vacancy:
      type: object
      properties:
        id:
          type: integer
          example: 6
        employer:
          $ref: "#/components/schemas/IdName"
        job_type:
          $ref: "#/components/schemas/IdType"
        job_role:
          type: string
          example: "Junior Backend Developer"
        is_remote:
          type: boolean
          example: false
        job_description:
          type: string
          example: "Design and implement robust microservices patterns..."
        location:
          type: string
          example: "Colombo 03, Sri Lanka"
        meta_data:
          $ref: "#/components/schemas/VacancyMetaData"
        skills:
          type: array
          items: { $ref: "#/components/schemas/VacancySkill" }

    VacancyListResponse:
      type: object
      properties:
        count: { type: integer, example: 42 }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Vacancy" }


    SkillDemand:
      type: object
      properties:
        id:             { type: integer, example: 12 }
        skill:          { type: string,  example: "Go (Golang)" }
        open_job_count: { type: integer, example: 89 }

    IndustrySkillsAnalytics:
      type: object
      properties:
        industry_id:
          type: integer
          example: 14
        unique_skills_count:
          type: integer
          example: 42
        most_in_demand_skill:
          $ref: "#/components/schemas/SkillDemand"
        top15_skills:
          type: array
          items: { $ref: "#/components/schemas/SkillDemand" }
        all_skills:
          type: array
          items: { $ref: "#/components/schemas/SkillDemand" }
        top_employers:
          type: array
          items: { $ref: "#/components/schemas/EmployerDemand" }


    CrawlerRun:
      type: object
      properties:
        id:          { type: integer, example: 3 }
        started_at:  { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]
          example: COMPLETED
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceJobCount:
      type: object
      properties:
        id:             { type: integer, example: 3 }
        source:         { type: string,  example: "Ikman" }
        open_job_count: { type: integer, example: 180 }

    CrawlerKpis:
      type: object
      properties:
        last_crawl_job_count: { type: integer, example: 142 }
        last_crawled_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-10T08:02:04Z"
        gap_seconds: { type: number, example: 3720 }
        gap_human:   { type: string, example: "1 hour(s) 2 minute(s) ago" }

    CrawlerOverview:
      type: object
      properties:
        kpis:
          $ref: "#/components/schemas/CrawlerKpis"
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceJobCount" }
        crawler_runs:
          type: array
          items: { $ref: "#/components/schemas/CrawlerRun" }


    IndustryListResponse:
      type: object
      properties:
        count:      { type: integer, example: 21 }
        industries:
          type: array
          items: { $ref: "#/components/schemas/IdName" }


    ErrorResponse:
      type: object
      properties:
        error:   { type: string, example: "Failed to fetch data" }
        details: { type: string, example: "Go backend returned an error" }

  parameters:
    IndustryIdQuery:
      name: industry_id
      in: query
      required: true
      schema: { type: integer }
      description: Industry ID from GET /industry

    OccupationIdQuery:
      name: occupation_id
      in: query
      required: true
      schema: { type: integer }
      description: Occupation ID from GET /dashboard/overview by_occupation list

    YearQuery:
      name: year
      in: query
      required: true
      schema: { type: integer }
      description: Calendar year e.g. 2026

  responses:
    BadRequest:
      description: Missing or invalid query parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: BFF failed to fetch from Go backend
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

paths:


  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Full dashboard overview
      description: |
        Fans out to 7 Go backend calls in parallel and returns a single aggregated
        response for the dashboard initial page load:
        - /stats/active-jobs
        - /stats/by-occupation
        - /stats/by-industry
        - /stats/by-experience
        - /stats/by-education
        - /stats/remote-vs-onsite
        - /stats/by-job-type
      responses:
        "200":
          description: Aggregated dashboard overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }
              example:
                active_jobs:
                  active_job_count: 312
                  last_month_count: 280
                  change_percent: 11.43
                  trend: up
                by_occupation:
                  count: 10
                  occupations:
                    - id: 8
                      name: "Professionals"
                      open_job_count: 154
                by_industry:
                  count: 21
                  industries:
                    - id: 14
                      name: "Information and Communication"
                      open_job_count: 312
                remote_vs_onsite:
                  remote_count: 42
                  on_site_count: 270
        "500": { $ref: "#/components/responses/InternalError" }

  /dashboard/occupation-analytics:
    get:
      tags: [Dashboard]
      summary: Occupation analytics panel data
      description: |
        Called when user clicks "See Analytics" on the occupation chart.
        Fans out to 2 Go backend calls in parallel:
        - /occupations/yearly-trend?occupation_id={id}
        - /occupations/top-job-roles?occupation_id={id}
      parameters:
        - $ref: "#/components/parameters/OccupationIdQuery"
      responses:
        "200":
          description: Occupation analytics for the selected occupation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupationAnalytics" }
              example:
                occupation_id: 8
                yearly_trend:
                  occupation_id: 8
                  count: 3
                  yearly_trend:
                    - { year: 2024, open_job_count: 98 }
                    - { year: 2025, open_job_count: 134 }
                    - { year: 2026, open_job_count: 154 }
                top_job_roles:
                  occupation_id: 8
                  top_job_roles:
                    - { job_role: "Senior Software Engineer", open_job_count: 24 }
                    - { job_role: "Backend Developer",        open_job_count: 18 }
                    - { job_role: "Full Stack Developer",     open_job_count: 15 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /dashboard/industry-analytics:
    get:
      tags: [Dashboard]
      summary: Industry analytics panel data
      description: |
        Called when user clicks "See Analytics" on the industry chart, and on every year tab change.
        Fans out to 5 Go backend calls in parallel:
        - /industries/yearly-trend?industry_id={id}
        - /industries/by-experience?industry_id={id}&year={year}
        - /industries/by-province?industry_id={id}&year={year}
        - /industries/by-education?industry_id={id}&year={year}
        - /industries/top-employers?industry_id={id}&year={year}
      parameters:
        - $ref: "#/components/parameters/IndustryIdQuery"
        - $ref: "#/components/parameters/YearQuery"
      responses:
        "200":
          description: Industry analytics for the selected industry and year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryAnalytics" }
              example:
                industry_id: 14
                year: 2026
                yearly_trend:
                  industry_id: 14
                  count: 3
                  yearly_trend:
                    - { year: 2024, open_job_count: 210 }
                    - { year: 2025, open_job_count: 268 }
                    - { year: 2026, open_job_count: 312 }
                by_province:
                  industry_id: 14
                  year: 2026
                  count: 9
                  provinces:
                    - { id: 1, province: "Western", lat: 6.9271, lng: 79.8612, open_job_count: 250 }
                    - { id: 2, province: "Central", lat: 7.2906, lng: 80.6337, open_job_count: 32 }
                top_employers:
                  industry_id: 14
                  year: 2026
                  count: 3
                  employers:
                    - { id: 5, name: "WSO2", open_job_count: 45 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }


  /vacancies/metadata:
    get:
      tags: [Vacancies]
      summary: Vacancy filter metadata
      description: |
        Called once on Vacancy Explorer page load to populate all filter dropdowns.
        Fans out to 4 Go backend calls in parallel:
        - /industries
        - /experiences
        - /provinces
        - /job-types
      responses:
        "200":
          description: Filter dropdown data for vacancy explorer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VacancyMetadata" }
              example:
                industries:
                  - { id: 14, name: "Information and Communication" }
                  - { id: 3,  name: "Manufacturing" }
                experiences:
                  - { id: 1, name: "Experience Required" }
                  - { id: 2, name: "Not Specified" }
                provinces:
                  - { id: 1, province: "Western", lat: 6.9271, lng: 79.8612 }
                  - { id: 2, province: "Central", lat: 7.2906, lng: 80.6337 }
                job_types:
                  - { id: 1, type: "Full Time" }
                  - { id: 2, type: "Part Time" }
        "500": { $ref: "#/components/responses/InternalError" }

  /vacancies:
    get:
      tags: [Vacancies]
      summary: Get active vacancy listings
      description: |
        Proxies to Go backend GET /jobs passing through any provided filter parameters.
        All filters are optional and combinable. Returns only active jobs (end_date IS NULL).
      parameters:
        - name: industry_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by industry ID
        - name: geo_data_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by province ID
        - name: job_type_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by job type ID
        - name: experience_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by experience level ID
      responses:
        "200":
          description: Active vacancy listings with full relational data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VacancyListResponse" }
              example:
                count: 2
                jobs:
                  - id: 6
                    employer: { id: 5, name: "WSO2" }
                    job_type:  { id: 1, type: "Full Time" }
                    job_role: "Junior Backend Developer"
                    is_remote: false
                    job_description: "Design and implement robust microservices..."
                    location: "Colombo 03, Sri Lanka"
                    meta_data:
                      geo_data:   { id: 1, province: "Western", lat: 6.9271, lng: 79.8612 }
                      industry:   { id: 14, name: "Information and Communication" }
                      experience: { id: 1,  name: "Experience Required" }
                      posted_at: "2026-06-12T11:45:00Z"
                      end_date: null
                    skills:
                      - { id: 12, skill: "Go (Golang)" }
                      - { id: 13, skill: "REST APIs" }
        "500": { $ref: "#/components/responses/InternalError" }


  /industry:
    get:
      tags: [Industry]
      summary: Get all industries
      description: |
        Proxies to Go backend GET /industries.
        Used to populate the industry dropdown on the Industry Skill Analytics page.
      responses:
        "200":
          description: Full industry list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryListResponse" }
              example:
                count: 21
                industries:
                  - { id: 14, name: "Information and Communication" }
                  - { id: 3,  name: "Manufacturing" }
        "500": { $ref: "#/components/responses/InternalError" }

  /industry/skills-analytics:
    get:
      tags: [Industry]
      summary: Industry skill analytics
      description: |
        Called when user selects an industry on the Industry Skill Analytics page.
        Fans out to 5 Go backend calls in parallel:
        - /industries/skills/count?industry_id={id}
        - /industries/skills/top-demand?industry_id={id}
        - /industries/skills/top15?industry_id={id}
        - /industries/skills?industry_id={id}
        - /industries/employers?industry_id={id}
      parameters:
        - $ref: "#/components/parameters/IndustryIdQuery"
      responses:
        "200":
          description: Complete skill analytics for the selected industry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustrySkillsAnalytics" }
              example:
                industry_id: 14
                unique_skills_count: 42
                most_in_demand_skill:
                  id: 12
                  skill: "Go (Golang)"
                  open_job_count: 89
                top15_skills:
                  - { id: 12, skill: "Go (Golang)",  open_job_count: 89 }
                  - { id: 13, skill: "REST APIs",    open_job_count: 74 }
                  - { id: 14, skill: "Microservices",open_job_count: 61 }
                all_skills:
                  - { id: 12, skill: "Go (Golang)",  open_job_count: 89 }
                top_employers:
                  - { id: 5, name: "WSO2",       open_job_count: 45 }
                  - { id: 8, name: "Sysco LABS", open_job_count: 32 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }


  /crawler/overview:
    get:
      tags: [Crawler]
      summary: Crawler operations overview
      description: |
        Called on Crawling Operations page load.
        Fans out to 4 Go backend calls in parallel:
        - /crawler/last-job-count
        - /crawler/time-gap
        - /crawler/runs
        - /sources
      responses:
        "200":
          description: Aggregated crawler monitoring data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerOverview" }
              example:
                kpis:
                  last_crawl_job_count: 142
                  last_crawled_at: "2026-07-10T08:02:04Z"
                  gap_seconds: 3720
                  gap_human: "1 hour(s) 2 minute(s) ago"
                sources:
                  - { id: 3, source: "Ikman",   open_job_count: 180 }
                  - { id: 4, source: "TopJobs", open_job_count: 96 }
                crawler_runs:
                  - id: 3
                    started_at:  "2026-07-10T08:00:00Z"
                    finished_at: "2026-07-10T08:02:04Z"
                    status: COMPLETED
                  - id: 2
                    started_at:  "2026-07-10T06:00:00Z"
                    finished_at: "2026-07-10T06:01:50Z"
                    status: COMPLETED
                  - id: 1
                    started_at:  "2026-07-09T23:00:00Z"
